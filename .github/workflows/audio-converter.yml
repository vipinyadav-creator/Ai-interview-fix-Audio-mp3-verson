name: Auto MP3 Converter

"on":
  schedule:
    # Har 5 minute check
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Ek samay par ek hi workflow run
concurrency:
  group: auto-mp3-converter
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Google credentials
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          test -n "$GOOGLE_CREDENTIALS_JSON" || {
            echo "ERROR: GOOGLE_CREDENTIALS_JSON secret is missing"
            exit 1
          }
          test -n "$GOOGLE_TOKEN_JSON" || {
            echo "ERROR: GOOGLE_TOKEN_JSON secret is missing"
            exit 1
          }
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          printf '%s' "$GOOGLE_TOKEN_JSON" > token.json

      - name: Run audio converter
        run: python fixedaudio.py

      - name: Save processed state to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add processed.json mp3_links.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "chore: update processed audio state [skip ci]"

          for attempt in 1 2 3; do
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Processed state saved successfully."
                exit 0
              fi
            fi

            git rebase --abort || true

            if [ "$attempt" -lt 3 ]; then
              echo "Push failed; retrying ($attempt/3)..."
              sleep 2
            fi
          done

          echo "ERROR: Could not push processed state after 3 attempts."
          exit 1
