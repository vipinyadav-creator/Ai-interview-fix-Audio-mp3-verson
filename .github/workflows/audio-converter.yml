name: Auto MP3 Converter

on:
  # Ye cron sirf "loop job" ko zinda rakhne ke liye hai.
  # Asli check har 1 minute job ke andar hota hai (run_loop.sh).
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [convert]

permissions:
  contents: write

concurrency:
  group: auto-mp3-converter
  cancel-in-progress: false

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # GitHub max 360 min

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"           # har baar dependencies download nahi hongi

      - name: Install ffmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "ffmpeg already installed"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Setup Google credentials
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
        run: |
          umask 077
          test -n "$GOOGLE_CREDENTIALS_JSON"
          test -n "$GOOGLE_TOKEN_JSON"
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > credentials.json
          printf '%s' "$GOOGLE_TOKEN_JSON" > token.json

      - name: Run converter loop (har 1 min check)
        env:
          LOOP_MINUTES: "330"      # ~5.5 ghante tak chalega
          INTERVAL_SECONDS: "60"   # har 60 sec me naya file check
        run: bash run_loop.sh
